name: Add firmware links to pull request
on:
  workflow_run:
    workflows: [Firmware pull request validation]
    types: [completed]

# The default GITHUB_TOKEN is read-only, so name what this job needs:
# listing the validation run's artifacts and commenting on the pull request.
permissions:
  actions: read
  pull-requests: write

jobs:
  artifacts-url-comments:
    name: Add artifact links to pull request
    runs-on: windows-2025
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: tonyhallett/artifacts-url-comments@v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prefix: "Community folder for this pull request:"
          format: "[Community.zip]({url})"
          addTo: pull
