; ******************************************************************************************
; X27 gauges on PoLabs PoStepVID6606 boards -- MobiFlight custom firmware (Arduino Mega)
; ******************************************************************************************
; Common build settings across this custom device
[env_X27Gauges]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE									; update() every loop(); only does work in the X27_NO_TIMER fallback
	;-DDEBUG2CMDMESSENGER											; uncomment this to get debug messages for the connector log
	; --- X27 tuning (all optional, defaults shown) ---
	;-DX27_TIMER=4													; 16-bit timer that drives stepping: 1, 3, 4 or 5. Costs PWM on its pins (T4 = D6/D7/D8). Servos use T5.
	;-DX27_NO_TIMER													; step from loop() instead of a timer interrupt (no PWM pins lost, motion judders when the Mega is busy)
	;-DX27_DEFAULT_SPEED=280										; max needle speed in deg/s when the Connector config string is empty
	;-DX27_DEFAULT_ACCEL=3000										; acceleration in deg/s^2, 0 = no ramp (instant full speed, like postep_gauges_fast.ino)
	;-DX27_DIR_TOWARD_ZERO=0										; DIR bit value that moves the needle toward the zero stop; flip to 1 if needles home the wrong way
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./X27Gauges													; Include files for your custom device
build_src_filter =
	+<../X27Gauges>													; build files for your custom device
lib_deps =															; You can add additional libraries if required
custom_core_firmware_version = 3.1.4								; define the version from the core firmware files your build should base on
custom_source_folder = X27Gauges									; path to your Custom Device Sources
custom_community_project = 	X27Gauges								; Folder name inside zip file, also ZIP file name if "custom_zip_filename" is not changed
custom_zip_filename = ${env_X27Gauges.custom_community_project}		; Name of the zip-file, overwrite it to define an different zip-file name

; Build settings for the Arduino Mega with X27 gauge support
[env:x27gauges_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
	${env_X27Gauges.build_flags}									; don't change this one!
	'-DMOBIFLIGHT_TYPE="X27 Gauges Mega"'							; this must match with "MobiFlightType" within the .json file
	'-DMOBIFLIGHT_NAME="X27 Gauges"' 								; this will show up as Name in the settings dialog unless it gets change from there
	-DMEMLEN_CONFIG=1496											; max. size for config which wil be stored in EEPROM
	-DMEMLEN_NAMES_BUFFER=1000										; max. size for configBuffer, contains only names from inputs
	-DMF_MAX_DEVICEMEM=1600											; max. memory size for devices
build_unflags =
build_src_filter =
	${env.build_src_filter}											; don't change this one!
	${env_X27Gauges.build_src_filter}								; don't change this one!
lib_deps =
	${env.lib_deps}													; don't change this one!
	${env.custom_lib_deps_Atmel}									; don't change this one!
	${env_X27Gauges.lib_deps}										; don't change this one!
monitor_speed = 115200												; don't change this one!
extra_scripts =
	${env.extra_scripts}											; don't change this one!
custom_core_firmware_version = ${env_X27Gauges.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_X27Gauges.custom_community_project}			; don't change this one!
custom_source_folder = ${env_X27Gauges.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_X27Gauges.custom_zip_filename}			; don't change this one!
